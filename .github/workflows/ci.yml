name: CI

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-test:
        # Package.swift needs Swift tools 6.2 and the macOS 26 SDK, which come
        # with Xcode 26 on the macOS 26 (arm64) runner image.
        runs-on: macos-26

        steps:
            - uses: actions/checkout@v4

            - name: Set up Xcode 26
              uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: "26"

            - name: Print Swift version
              run: swift --version

            - name: Print Xcode version
              run: xcodebuild -version

            - name: Build
              run: swift build

            # The live tests skip themselves when MacPorts isn't installed,
            # as on the runner.
            - name: Test
              run: swift test
