name: CI

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-test:
        name: build-and-test (${{ matrix.name }})
        # Package.swift needs Swift tools 6.2 and the macOS 26 SDK, which come
        # with Xcode 26.
        runs-on: ${{ matrix.runs-on }}
        strategy:
            # A failure on one runner doesn't cancel the other.
            fail-fast: false
            matrix:
                include:
                    # GitHub-hosted macOS 26 (arm64) image.
                    - name: macos-26
                      runs-on: macos-26
                      setup-xcode: true
                    # The local self-hosted runner. It uses the Xcode already
                    # selected there, and has MacPorts, so the live tests run.
                    - name: macos-arm64
                      runs-on: [self-hosted, macos-arm64]
                      setup-xcode: false

        steps:
            - uses: actions/checkout@v4

            - name: Set up Xcode 26
              if: matrix.setup-xcode
              uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: "26"

            - name: Print Swift version
              run: swift --version

            - name: Print Xcode version
              run: xcodebuild -version

            - name: Build
              run: swift build

            # The live tests skip themselves when MacPorts isn't installed,
            # as on the GitHub-hosted runner.
            - name: Test
              run: swift test
